[versions]
agp = "9.3.1"
kotlin = "2.4.10"
compose-bom = "2026.08.00"
material3 = "1.5.0-alpha26"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.9.8"
core = "1.19.0"
credentials = "1.5.0"
coroutines = "1.9.0"
junit4 = "4.13.2"
# ADB client (:adb). libadb-android is on JitPack (group restricted in settings.gradle.kts).
libadb = "3.1.1"
conscrypt = "2.5.3"
bouncycastle = "1.81"
robolectric = "4.17"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
smali = "3.0.10"
arsclib = "1.4.0"
apksig = "9.3.1"
# Development-only Compose Driver harness; never on the app's runtime classpath.
compose-driver = "0.5.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-text-google-fonts = { module = "androidx.compose.ui:ui-text-google-fonts" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
libadb-android = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk15to18", version.ref = "bouncycastle" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
smali-smali = { module = "com.android.tools.smali:smali", version.ref = "smali" }
smali-baksmali = { module = "com.android.tools.smali:smali-baksmali", version.ref = "smali" }
smali-dexlib2 = { module = "com.android.tools.smali:smali-dexlib2", version.ref = "smali" }
arsclib = { module = "io.github.reandroid:ARSCLib", version.ref = "arsclib" }
apksig = { module = "com.android.tools.build:apksig", version.ref = "apksig" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
compose-driver = { module = "io.github.jdemeulenaere:compose-driver", version.ref = "compose-driver" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
