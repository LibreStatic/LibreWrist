# Builds the LibreWrist app and publishes its APKs as a GitHub release whenever something under
# patcher-app/, or one of the directories it bundles, changes on main (or on demand). Each release
# carries two APKs with the same versionName and build number: openshm-patcher-<ver>-r<N>.apk (the full
# app) and openshm-patcher-noguide-<ver>-r<N>.apk (built with -PnoGuide: package
# io.openshm.patcher.noguide, no accessibility service, for phones where Play Protect blocks apps that
# declare one), plus SHA256SUMS.
#
# Repository secrets (the LibreStatic release key; store and key share one password):
#   LIBRESTATIC_KEYSTORE_BASE64   base64 of the PKCS#12 keystore
#   LIBRESTATIC_KEYSTORE_PASSWORD its password
#   LIBRESTATIC_KEY_ALIAS         the key's alias
# Optional repository variables:
#   PATCHER_CERT_SHA256  expected SHA-256 of the signing certificate; the release fails on a mismatch
#   CATALOGUE_URL        catalogue update channel baked into the app; defaults to this repository's
#                        raw catalogue/ directory on the default branch
#   UPDATE_REPO          GitHub repository (owner/name) the app checks for newer builds; defaults to
#                        this repository
# Without the signing secrets the workflow fails instead of publishing a debug-signed APK, which
# could not upgrade an installed patcher.

name: Patcher release

on:
  push:
    branches: [main]
    paths:
      - "patcher-app/**"
      # Bundled into the APK as assets (patcher-app/app/own-code.gradle.kts).
      - "watch-mod/**"
      - "shm-bridge/**"
      - "catalogue/**"
      - ".github/workflows/patcher-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patcher-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_TOOLS_VERSION: "36.0.0"
      PLATFORM_API: "36"
      PATCHER_VERSION_CODE: ${{ github.run_number }}
      UPDATE_REPO: ${{ vars.UPDATE_REPO || github.repository }}
      CATALOGUE_URL: ${{ vars.CATALOGUE_URL || format('https://raw.githubusercontent.com/{0}/{1}/catalogue', github.repository, github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history and tags: the release notes list the commits since the previous patcher release.
          fetch-depth: 0

      # Every upload needs a versionName no earlier release used (AGENTS.md, Versioning); a push that
      # changes the app without bumping it fails here, before the build, instead of publishing a
      # second release with the same name.
      - name: Check that the version name is new
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' patcher-app/app/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "::error::could not read versionName from patcher-app/app/build.gradle.kts"
            exit 1
          fi
          echo "PATCHER_VERSION_NAME=$version" >> "$GITHUB_ENV"
          taken="$(git tag --list "patcher-v$version-r*")"
          if [ -n "$taken" ]; then
            echo "::error::versionName $version was already released ($(echo $taken)); bump it in patcher-app/app/build.gradle.kts"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships these SDK packages, so the sdkmanager setup (which also downloads its own
      # command-line tools whenever the image has another version) only runs when one is missing. They
      # are not cached: the image's directories are root-owned, so restoring over them always failed.
      - name: Check the Android SDK packages
        id: sdk
        run: |
          missing=false
          for pkg in platforms/android-36 platforms/android-37.0 build-tools/36.0.0 build-tools/37.0.0; do
            if [ ! -f "$ANDROID_HOME/$pkg/source.properties" ]; then
              echo "Missing from the runner image: $pkg"
              missing=true
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - if: steps.sdk.outputs.missing == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 platforms;android-37.0 build-tools;36.0.0 build-tools;37.0.0"

      # Caches the Gradle user home between runs: dependencies, the wrapper distribution, artifact
      # transforms, compiled build scripts and the local build cache (task outputs reused by later
      # builds; org.gradle.caching is on in gradle.properties).
      - uses: gradle/actions/setup-gradle@v5

      # gradle.properties is sized for a memory-bound workstation; the runner (4 cores, 16 GB) gets a
      # bigger daemon, one worker per core and two JVMs for the Robolectric tests. Properties in the
      # Gradle user home override the project's.
      - name: Size Gradle for the runner
        run: |
          cat >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties" <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          openshm.testForks=2
          PROPS

      - name: Restore the signing key
        env:
          P12_BASE64: ${{ secrets.LIBRESTATIC_KEYSTORE_BASE64 }}
          P12_PASSWORD: ${{ secrets.LIBRESTATIC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIBRESTATIC_KEY_ALIAS }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::the LIBRESTATIC_KEYSTORE_BASE64, LIBRESTATIC_KEYSTORE_PASSWORD and LIBRESTATIC_KEY_ALIAS secrets are required to publish"
            exit 1
          fi
          keys="$RUNNER_TEMP/openshm-keys"
          ( umask 077; mkdir -p "$keys"
            printf '%s' "$P12_BASE64" | base64 -d > "$keys/patcher.p12"
            printf '%s' "$P12_PASSWORD" > "$keys/patcher.pass" )
          echo "OPENSHM_KEYS_DIR=$keys" >> "$GITHUB_ENV"
          echo "PATCHER_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      # One Gradle run: the build is configured once and the release tasks overlap with the tests. A
      # failing test still fails the step before anything is published.
      - name: Test and build the release APK
        run: |
          patcher-app/gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:assembleRelease
          mkdir -p "$RUNNER_TEMP/out"
          cp patcher-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/openshm-patcher-$PATCHER_VERSION_NAME-r$PATCHER_VERSION_CODE.apk"

      # The same app as a separate package without Tic, the interactive guide, so it declares no
      # accessibility service. Same output path as the full build, hence the copy right after each run.
      - name: Build the APK without the guide
        run: |
          patcher-app/gradlew --no-daemon -PnoGuide :app:assembleRelease
          cp patcher-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/openshm-patcher-noguide-$PATCHER_VERSION_NAME-r$PATCHER_VERSION_CODE.apk"

      - name: Check the signature
        env:
          EXPECTED_CERT: ${{ vars.PATCHER_CERT_SHA256 }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          for apk in "$RUNNER_TEMP"/out/*.apk; do
            echo "Checking $(basename "$apk")"
            certs="$("$apksigner" verify --print-certs "$apk")"
            # "Signer #1 certificate ..." with a v1 signature, "V2 Signer: certificate ..." without one.
            actual="$(printf '%s\n' "$certs" | sed -nE 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' | head -n1)"
            if [ -z "$actual" ]; then
              echo "::error::could not read the signing certificate"
              exit 1
            fi
            echo "Signing certificate SHA-256: $actual"
            if [ -n "$EXPECTED_CERT" ] && [ "$actual" != "$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')" ]; then
              echo "::error::signing certificate does not match PATCHER_CERT_SHA256"
              exit 1
            fi
          done

      # The point of the second APK: a different package that declares no accessibility service at all.
      - name: Check the APK without the guide
        run: |
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          full="$RUNNER_TEMP/out/openshm-patcher-$PATCHER_VERSION_NAME-r$PATCHER_VERSION_CODE.apk"
          noguide="$RUNNER_TEMP/out/openshm-patcher-noguide-$PATCHER_VERSION_NAME-r$PATCHER_VERSION_CODE.apk"
          if [ "$("$aapt2" dump packagename "$full")" != "io.openshm.patcher" ]; then
            echo "::error::the full APK is not package io.openshm.patcher"
            exit 1
          fi
          if [ "$("$aapt2" dump packagename "$noguide")" != "io.openshm.patcher.noguide" ]; then
            echo "::error::the APK without the guide is not package io.openshm.patcher.noguide"
            exit 1
          fi
          manifest="$("$aapt2" dump xmltree --file AndroidManifest.xml "$noguide")"
          if [ -z "$manifest" ]; then
            echo "::error::could not read the manifest of the APK without the guide"
            exit 1
          fi
          if printf '%s\n' "$manifest" | grep -qi accessibility; then
            echo "::error::the APK without the guide still mentions accessibility in its manifest"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$PATCHER_VERSION_NAME"
          tag="patcher-v$version-r$PATCHER_VERSION_CODE"
          out="$RUNNER_TEMP/out"
          ( cd "$out" && sha256sum *.apk > SHA256SUMS )
          # The earlier patcher release with the highest build number; its commit bounds the change list.
          previous="$(git tag --list 'patcher-v*' | awk -F-r -v n="$PATCHER_VERSION_CODE" \
            '{ c = $NF + 0 } c < n && c > best { best = c; t = $0 } END { print t }')"
          if [ -n "$previous" ]; then
            range="$previous..$GITHUB_SHA"
            heading="Changes since ${previous#patcher-v}:"
          else
            range="$GITHUB_SHA"
            heading="Changes:"
          fi
          limit=60
          total="$(git rev-list --count --no-merges "$range")"
          {
            echo "LibreWrist $version (build $PATCHER_VERSION_CODE), built from ${GITHUB_SHA::7}."
            echo
            echo "$heading"
            echo
            git log --no-merges --format='- %s (%h)' -n "$limit" "$range"
            if [ "$total" -gt "$limit" ]; then
              echo "- …and $((total - limit)) more"
            fi
            echo
            echo "Install openshm-patcher-$version-r$PATCHER_VERSION_CODE.apk on the phone; it upgrades any earlier build in place. openshm-patcher-noguide-$version-r$PATCHER_VERSION_CODE.apk is the same app without Tic, the interactive guide, so it declares no accessibility service; it installs as a separate app and does not upgrade the regular one. Checksums: SHA256SUMS."
          } > "$out/notes.md"
          gh release create "$tag" "$out"/*.apk "$out/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "LibreWrist $version (build $PATCHER_VERSION_CODE)" \
            --notes-file "$out/notes.md"

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/openshm-keys"
