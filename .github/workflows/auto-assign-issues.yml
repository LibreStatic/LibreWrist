# Assigns new issues and pull requests to the maintainer so GitHub sends an assignment
# notification. The action ignores the event payload and assigns every open, unassigned
# issue and pull request on each run; workflow_dispatch allows a manual sweep.
name: Auto-assign issues and pull requests

on:
  issues:
    types:
      - opened
  # pull_request_target so pull requests from forks get a token that can assign. Safe here:
  # no pull request code is checked out or run.
  pull_request_target:
    types:
      - opened
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # gustavofreze/auto-assign 2.1.0, pinned to its commit.
      - uses: gustavofreze/auto-assign@f4af3753657f61d54cf16600e99f863972eea5e2
        with:
          assignees: FacuM
          github_token: ${{ secrets.GITHUB_TOKEN }}
          assignment_options: ISSUE,PULL_REQUEST
