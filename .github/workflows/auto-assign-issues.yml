# Assigns every new issue to the maintainer so GitHub sends an assignment notification.
name: Auto-assign issues

on:
  issues:
    types:
      - opened

permissions:
  issues: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      # gustavofreze/auto-assign 2.1.0, pinned to its commit.
      - uses: gustavofreze/auto-assign@f4af3753657f61d54cf16600e99f863972eea5e2
        with:
          assignees: FacuM
          github_token: ${{ secrets.GITHUB_TOKEN }}
          assignment_options: ISSUE
